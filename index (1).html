<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Place Value Regrouping</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f6f3ea;color:#25313b} .app{max-width:1200px;margin:auto;padding:18px}.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.card{background:white;border:2px solid #d8d1c2;border-radius:16px;padding:14px;box-shadow:0 3px 10px #0001}.controls{display:flex;gap:10px;align-items:center;margin-left:auto}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;background:#2d6cdf;color:#fff}.btn.secondary{background:#e8e3d8;color:#25313b}.btn.good{background:#3c9a67}.btn:disabled{opacity:.45;cursor:not-allowed}.problem{font-size:34px;font-weight:800;text-align:center;margin:12px}.chart{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.place{min-height:330px;border:3px solid #52616b;border-radius:14px;background:#fffdf8;position:relative;overflow:hidden}.head{text-align:center;background:#52616b;color:white;padding:9px;font-weight:800}.digit{text-align:center;font-size:46px;font-weight:800;padding:8px}.value{text-align:center;color:#69747b;font-weight:700}.blocks{padding:8px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:5px;min-height:190px}.block{cursor:grab;user-select:none;position:relative}.one{width:22px;height:22px;background:#e7a23b;border-radius:4px}.ten{width:22px;height:70px;background:#55a6d9;border-radius:4px}.hundred{width:70px;height:70px;background:#72b56d;border-radius:5px}.thousand{width:70px;height:70px;background:#bd79b6;border-radius:5px}.crossed{opacity:.3;text-decoration:line-through;filter:grayscale(1)}.drop{outline:4px dashed #f0a43b;outline-offset:-6px}.num-only .blocks{display:none}.num-only .place{min-height:180px}.num-only .digit{padding-top:35px}.hint{margin-top:10px;text-align:center;min-height:26px;font-weight:700}.answer{display:flex;justify-content:center;gap:8px;margin:15px}.answer input{width:140px;font-size:28px;text-align:center;padding:8px;border-radius:9px;border:2px solid #aaa}.instructions{line-height:1.45}.toggle{display:flex;align-items:center;gap:8px;font-weight:700}.switch{width:50px;height:28px;background:#aaa;border-radius:20px;position:relative;cursor:pointer}.switch:after{content:'';width:22px;height:22px;background:white;border-radius:50%;position:absolute;top:3px;left:4px;transition:.2s}.switch.on{background:#3c9a67}.switch.on:after{left:24px}.mark{position:absolute;right:6px;top:44px;font-size:12px}.footer{text-align:center;margin-top:10px;color:#59656c}
@media(max-width:750px){.chart{grid-template-columns:repeat(2,1fr)}.problem{font-size:27px}}
</style></head><body><div class="app">
<div class="top card"><div><b>Place Value Regrouping</b><div>Build, trade, cross out, and solve.</div></div><div class="controls"><label>Digits <select id="digits"><option value="2">2 digits</option><option value="3" selected>3 digits</option><option value="4">4 digits</option></select></label><div class="toggle">Blocks <div id="toggle" class="switch on"></div></div><button class="btn secondary" id="new">New Problem</button></div></div>
<div class="card instructions"><b>How to use:</b> Drag a block to the place on its right to trade it (1 ten → 10 ones, 1 hundred → 10 tens). In number-only mode, drag a digit away from its column to regroup it. You can click blocks to cross them out as you subtract.</div>
<div class="problem" id="problem"></div><div id="chart" class="chart"></div><div class="hint" id="hint"></div>
<div class="answer"><input id="answer" inputmode="numeric" placeholder="Answer"><button class="btn good" id="check">Check Answer</button></div><div class="footer" id="feedback"></div>
</div>
<script>
const places=['Thousands','Hundreds','Tens','Ones']; const short=['1000','100','10','1']; let digits=3, minuend=0, sub=0, vals=[], original=[], blocksMode=true, dragged=null;
function randProblem(){let min=Math.pow(10,digits-1), max=Math.pow(10,digits)-1; do{minuend=Math.floor(Math.random()*(max-min+1))+min; sub=Math.floor(Math.random()*(minuend-min+1));}while(!needsRegroup(minuend,sub)); vals=digitsTo(minuend); original=[...vals]; render(); document.getElementById('answer').value=''; msg('');}
function needsRegroup(a,b){let x=String(a).padStart(digits,'0').split('').map(Number),y=String(b).padStart(digits,'0').split('').map(Number);return y.some((n,i)=>n>x[i]);}
function digitsTo(n){let s=String(n).padStart(4,'0').split('').map(Number);return s;}
function render(){document.getElementById('problem').textContent=`${minuend.toLocaleString()} − ${sub.toLocaleString()} = ?`;let c=document.getElementById('chart');c.className='chart'+(blocksMode?'':' num-only');c.innerHTML='';let start=4-digits; for(let i=start;i<4;i++){let p=document.createElement('div');p.className='place';p.dataset.i=i;p.innerHTML=`<div class="head">${places[i]}<br><small>${short[i]}</small></div><div class="digit">${vals[i]}</div><div class="value">Value: ${vals[i]*10**(3-i)}</div><div class="blocks"></div><button class="btn secondary mark">Mark mode</button>`;c.appendChild(p); if(blocksMode) fillBlocks(p,i); p.addEventListener('dragover',e=>{e.preventDefault();p.classList.add('drop')});p.addEventListener('dragleave',()=>p.classList.remove('drop'));p.addEventListener('drop',e=>{e.preventDefault();p.classList.remove('drop');trade(i)});p.querySelector('.mark').onclick=()=>toggleMark(p,i);}
}
function fillBlocks(p,i){let b=p.querySelector('.blocks'),count=vals[i]; if(count>0&&count<=60){for(let k=0;k<count;k++){let d=document.createElement('div');d.className='block '+['thousand','hundred','ten','one'][i];d.draggable=true;d.dataset.i=i;d.ondragstart=()=>dragged={i,el:d};d.onclick=()=>d.classList.toggle('crossed');b.appendChild(d)}}else if(count>60){b.textContent='Too many individual blocks to display; use number-only mode.'}}
function trade(to){if(!dragged)return;let from=dragged.i; if(to!==from+1||from>=3){msg('That trade is not allowed. Trade one place-value unit into the place immediately to its right.');return} if(vals[from]<=0){msg('You cannot regroup from a place with 0.');return} vals[from]--;vals[to]+=10;dragged=null;render();msg(`Great! 1 ${places[from].slice(0,-1)} became 10 ${places[to].toLowerCase()}.`)}
function toggleMark(p,i){let b=p.querySelector('.blocks'); if(!b)return; b.querySelectorAll('.block').forEach(x=>x.onclick=()=>{x.classList.toggle('crossed')}); msg('Click a remaining block to mark it out.')}
function numDrag(){document.querySelectorAll('.digit').forEach((d,i)=>{let idx=4-digits+i;d.draggable=true;d.ondragstart=()=>dragged={i:idx,el:d,num:true};d.ondragend=()=>dragged=null;})}
function msg(t){document.getElementById('hint').textContent=t} function feedback(t){document.getElementById('feedback').textContent=t}
document.getElementById('toggle').onclick=()=>{blocksMode=!blocksMode;document.getElementById('toggle').classList.toggle('on',blocksMode);render();if(!blocksMode){numDrag();document.querySelectorAll('.digit').forEach(d=>{d.ondragover=e=>e.preventDefault();d.ondrop=e=>{let idx=+d.parentElement.dataset.i;let from=dragged.i;if(idx===from+1&&vals[from]>0){vals[from]--;vals[idx]+=10;render();numDrag();msg('Nice regroup!')}}})}};
document.getElementById('digits').onchange=e=>{digits=+e.target.value;randProblem()};document.getElementById('new').onclick=randProblem;document.getElementById('check').onclick=()=>{let a=Number(document.getElementById('answer').value);let expected=minuend-sub;if(a===expected){feedback='Correct! 🎉';setTimeout(randProblem,1200)}else feedback='Not yet. Check your regrouping and crossed-out blocks, then try again.'};randProblem();
</script></body></html>
